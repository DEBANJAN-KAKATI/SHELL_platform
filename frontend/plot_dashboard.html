<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Summary Dashboard | DHA Data Dashboard</title>
    <link href="/frontend/css/dashboard.css" rel="stylesheet">
    <link href="/frontend/css/claude-theme.css" rel="stylesheet">
    <link href="/frontend/css/plot_dashboard.css?v=3" rel="stylesheet">
    <script src="/frontend/js/lucide.min.js" defer></script>
    <script src="/frontend/js/plot_dashboard_store.js" defer></script>
    <script src="/frontend/js/navigation.js?v=5" defer></script>
    <script src="/frontend/js/plot_dashboard.js?v=2" defer></script>
</head>
<body class="dashboard-page">
    <main>
        <header class="board-header">
            <a class="board-brand" href="/"><span>D</span>DHA <b>Dashboard</b></a>
            <div class="header-actions">
                <button class="board-button" id="boardPrint" type="button"><i data-lucide="printer" aria-hidden="true"></i>Print / PDF</button>
                <button class="board-icon-button" id="pageRefresh" type="button" title="Clear dashboard" aria-label="Clear dashboard"><i data-lucide="rotate-ccw" aria-hidden="true"></i></button>
            </div>
        </header>
        <div class="board-content" id="plotDashboard">
            <section class="board-heading">
                <div><div class="board-eyebrow">RUN WORKSPACE / REPORTS</div><h1>Summary Dashboard</h1><p id="boardRun"></p></div>
                <div class="board-toolbar"><span class="board-count" id="boardCount">0 / 12 plots</span><a class="board-button board-primary" href="/frontend/plots.html"><i data-lucide="plus" aria-hidden="true"></i>Add plot</a></div>
            </section>
            <p class="board-status" id="boardStatus" role="status" aria-live="polite"></p>
            <section class="board-grid" id="boardGrid" aria-label="Dashboard plots"></section>
            <section class="board-table-section" id="boardTableSection" data-empty="true" aria-labelledby="boardTableHeading">
                <div class="board-table-heading"><div><div class="board-eyebrow">DATA RECORD</div><h2 id="boardTableHeading">Summary table</h2></div><div class="board-toolbar"><button class="board-button" id="boardAddTable" type="button"><i data-lucide="table-2" aria-hidden="true"></i>Add table</button><button class="board-icon-button" id="boardDeleteTable" type="button" title="Delete table" aria-label="Delete table" hidden><i data-lucide="trash-2" aria-hidden="true"></i></button></div></div>
                <p class="board-table-meta" id="boardTableMeta"></p>
                <div class="board-table-wrap" id="boardTable"></div>
            </section>
            <footer class="board-footer"><span>DHA Data Dashboard</span><span id="boardReportDate"></span></footer>
        </div>
    </main>
</body>
</html>
